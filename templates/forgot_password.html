{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0">
            
            <div class="card-header text-center bg-white border-0 pt-4 pb-2">
                <h3 class="text-success fw-bold"><i class="fas fa-key me-2"></i>Reset Password</h3>
                <p class="text-muted small">Verify your identity to reset access</p>
            </div>
            
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-bold">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter your username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary fw-bold">Authenticator Code</label>
                        <input type="text" name="otp" class="form-control form-control-lg text-center fw-bold text-success border-success" 
                               style="letter-spacing: 0.5rem;" 
                               placeholder="000 000" maxlength="6" required autocomplete="off">
                        <small class="text-muted">Enter the 6-digit code from your app.</small>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary fw-bold">New Password</label>
                        <input type="password" name="new_password" class="form-control form-control-lg" placeholder="Create new password" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">
                            Reset Password
                        </button>
                        <a href="/login" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
