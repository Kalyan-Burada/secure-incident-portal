{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="text-success text-center mb-4">Register Account</h2>
        <form method="POST" action="/register">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Role</label>
                <select name="role" class="form-select" id="roleSelect" onchange="toggleAdminKey()">
                    <option value="Employee">Employee (Reporter)</option>
                    <option value="Analyst">Analyst (Investigator)</option>
                    <option value="Admin">Admin (Manager)</option>
                </select>
            </div>
            <div class="mb-3" id="adminKeyField" style="display:none;">
                <label class="form-label text-danger fw-bold">Master Admin Key</label>
                <input type="password" name="admin_key" class="form-control" placeholder="Required for Admin role">
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">Create Account</button>
        </form>
    </div>
</div>

<script>
function toggleAdminKey() {
    var role = document.getElementById("roleSelect").value;
    var keyField = document.getElementById("adminKeyField");
    if (role === "Admin") {
        keyField.style.display = "block";
    } else {
        keyField.style.display = "none";
    }
}
</script>
{% endblock %}
