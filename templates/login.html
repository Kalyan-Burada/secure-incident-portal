{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0">
            
            <div class="card-header text-center bg-white border-0 pt-4 pb-2">
                <h3 class="text-success fw-bold">Secure Login</h3>
                <p class="text-muted small">Access your secure dashboard</p>
            </div>
            
            <div class="card-body p-4">
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label text-secondary fw-bold">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter username" required autofocus>
                    </div>
                    <div class="mb-2">
                        <label class="form-label text-secondary fw-bold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter password" required>
                    </div>
                    
                    <div class="text-end mb-4">
                        <a href="/forgot_password" class="text-decoration-none small text-muted">Forgot Password?</a>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">
                            Next Step &rarr;
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="card-footer text-center py-3 bg-light border-0">
                <small class="text-muted">Don't have an account? <a href="/register" class="text-decoration-none fw-bold text-success">Register here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
